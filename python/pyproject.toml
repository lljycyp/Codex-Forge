[project]
name = "codex-forge"
version = "0.1.0"
description = "Windows profile and multi-instance manager for the Codex desktop app."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14,<4",
    "backports-zstd>=1 ; python_full_version < '3.14'",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pyinstaller>=6.14.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pyinstaller]
entry = "main.py"
